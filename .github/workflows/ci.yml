name: "CI/CD"

# Practica 3 - Ejercicio 3
# Variables de entorno a nivel de workflow
env:
  IMAGE_NAME: my-app
  APP_URL: myapp

# Practica 3 - Ejercicio 1
# Eventos que disparan el workflow
on:
  # Se ejecuta en todas las ramas
  push:
    branches: ['**']

  # Se ejecuta al crear PR con destino develop y master
  pull_request:
    branches: [develop, master]

  # Permite ejecutar el workflow manualmente con un input booleano RUN_CD (default false)
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: "Run CD stage"
        required: false
        default: false
        type: boolean

# Definicion de jobs
jobs:
  # Job CI
  ci:
    runs-on: ubuntu-latest

    # Practica 3 - Ejercicio 3
    env:
      APP_URL: myappurl

    # Practica 3 - Ejercicio 2
    # Pasos
    steps:

      # Clona el repositorio en el runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Imprimir información del entorno
      - name: Info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Name: ${{ runner.name }}"

      # Imprimir variables
      - name: Variables
        run: |
          echo "IMAGE_NAME: $IMAGE_NAME"
          echo "APP_URL: ${{ env.APP_URL }}"
